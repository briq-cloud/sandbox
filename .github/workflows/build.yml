# Builds the sandbox images, pushes them to ghcr.io/briq-cloud/sandbox and writes REFERENCE.md and
# REFERENCE-full.md from what each image has. Every Monday, on every push to main, and by hand.
#
# Tags: `latest` and `<date>` for the default image, `full` and `full-<date>` for the full one. A
# date tag never moves; `latest` and `full` follow the newest build.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['REFERENCE.md', 'REFERENCE-full.md']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/briq-cloud/sandbox

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push the default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BASE=${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:full
            ${{ env.IMAGE }}:full-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write the reference from the images
        run: |
          set -eu
          size() { docker manifest inspect "$1" | jq '[.layers[].size] | add / 1048576 | round'; }
          for t in "${{ steps.date.outputs.tag }}" "full-${{ steps.date.outputs.tag }}"; do
            case "$t" in full-*) out=REFERENCE-full.md ;; *) out=REFERENCE.md ;; esac
            docker run --rm "$IMAGE:$t" sandbox-versions > "$out"
            printf '\n## Image\n\n`%s:%s`, %s MB compressed. The Dockerfile: [%s](%s).\n' \
              "$IMAGE" "$t" "$(size "$IMAGE:$t")" \
              "$( [ "$out" = REFERENCE.md ] && echo Dockerfile || echo Dockerfile.full )" \
              "$( [ "$out" = REFERENCE.md ] && echo Dockerfile || echo Dockerfile.full )" >> "$out"
          done
          cat REFERENCE.md REFERENCE-full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the reference
        run: |
          set -eu
          git config user.name 'briq build'
          git config user.email 'hello@briq.cloud'
          git add REFERENCE.md REFERENCE-full.md
          git diff --cached --quiet && exit 0
          git commit -m "Reference: ${{ steps.date.outputs.tag }}"
          git push

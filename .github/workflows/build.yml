# Builds the sandbox images, pushes them to ghcr.io/briq-cloud/sandbox and writes REFERENCE.md,
# REFERENCE-full.md, REFERENCE-desktop.md and REFERENCE-kvm.md from what each image has. Every Monday, on every push
# to main, and by hand.
#
# Tags: `latest` and `<date>` for the default image, `full` and `full-<date>` for the full one,
# `desktop` and `desktop-<date>` for the desktop, `kvm` and `kvm-<date>` for the kvm one, `android` and `android-<date>` for the kvm one with the Android SDK. A date tag never moves; the others follow the
# newest build.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['REFERENCE.md', 'REFERENCE-full.md', 'REFERENCE-desktop.md', 'REFERENCE-kvm.md', 'REFERENCE-3d.md', 'REFERENCE-android.md']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/briq-cloud/sandbox

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push the default image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish the exact local candidate only after the functional smoke passes.
      - name: Build the 3D candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.3d
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: BASE=${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          tags: sandbox:3d-candidate
          cache-from: type=gha,scope=3d
          cache-to: type=gha,scope=3d,mode=max

      - name: Smoke and publish the 3D image
        run: |
          set -eu
          docker run --rm sandbox:3d-candidate /opt/3d/smoke.sh
          docker tag sandbox:3d-candidate "$IMAGE:3d"
          docker push "$IMAGE:3d"
          tag="3d-${{ steps.date.outputs.tag }}"
          # Preserve the first successful build tagged with this date.
          if ! docker manifest inspect "$IMAGE:$tag" > /dev/null 2>&1; then
            docker tag sandbox:3d-candidate "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          fi

      - name: Build and push the full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BASE=${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:full
            ${{ env.IMAGE }}:full-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the desktop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.desktop
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BASE=${{ env.IMAGE }}:full-${{ steps.date.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:desktop
            ${{ env.IMAGE }}:desktop-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the kvm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.kvm
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:kvm
            ${{ env.IMAGE }}:kvm-${{ steps.date.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the android image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.android
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BASE=${{ env.IMAGE }}:kvm-${{ steps.date.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:android
            ${{ env.IMAGE }}:android-${{ steps.date.outputs.tag }}
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max

      - name: Write the reference from the images
        run: |
          set -eu
          size() { docker manifest inspect "$1" | jq '[.layers[].size] | add / 1048576 | round'; }
          for t in "${{ steps.date.outputs.tag }}" "full-${{ steps.date.outputs.tag }}" "desktop-${{ steps.date.outputs.tag }}" "kvm-${{ steps.date.outputs.tag }}" "3d-${{ steps.date.outputs.tag }}" "android-${{ steps.date.outputs.tag }}"; do
            case "$t" in
              full-*) out=REFERENCE-full.md file=Dockerfile.full ;;
              desktop-*) out=REFERENCE-desktop.md file=Dockerfile.desktop ;;
              3d-*) out=REFERENCE-3d.md file=Dockerfile.3d ;;
              kvm-*) out=REFERENCE-kvm.md file=Dockerfile.kvm ;;
              android-*) out=REFERENCE-android.md file=Dockerfile.android ;;
              *) out=REFERENCE.md file=Dockerfile ;;
            esac
            docker run --rm "$IMAGE:$t" sandbox-versions > "$out"
            case "$t" in
              android-*)
                printf '\n## Android SDK\n\n```\n' >> "$out"
                docker run --rm "$IMAGE:$t" sdkmanager --list_installed >> "$out"
                printf '```\n' >> "$out" ;;
            esac
            printf '\n## Image\n\n`%s:%s`, %s MB compressed. The Dockerfile: [%s](%s).\n' \
              "$IMAGE" "$t" "$(size "$IMAGE:$t")" "$file" "$file" >> "$out"
          done
          cat REFERENCE.md REFERENCE-full.md REFERENCE-desktop.md REFERENCE-kvm.md REFERENCE-3d.md REFERENCE-android.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the reference
        run: |
          set -eu
          git config user.name 'briq build'
          git config user.email 'hello@briq.cloud'
          git add REFERENCE.md REFERENCE-full.md REFERENCE-desktop.md REFERENCE-kvm.md REFERENCE-3d.md REFERENCE-android.md
          git diff --cached --quiet && exit 0
          git commit -m "Reference: ${{ steps.date.outputs.tag }}"
          git push
